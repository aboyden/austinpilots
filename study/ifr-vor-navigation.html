<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    padding: 24px;
    box-sizing: border-box;
  }
  .gate {
    width: 100%;
    max-width: 360px;
    background: #1a1d27;
    border: 1px solid #2e3348;
    border-radius: 12px;
    padding: 32px;
    text-align: center;
  }
  .gate h1 { font-size: 18px; margin: 0 0 6px; color: #fff; }
  .gate p { font-size: 13px; color: #8892aa; margin: 0 0 20px; }
  .gate input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #2e3348;
    background: #0f1117;
    color: #e2e8f0;
    margin-bottom: 12px;
  }
  .gate button {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    background: #4f8ef7;
    color: #fff;
    cursor: pointer;
  }
  .gate button:disabled { opacity: 0.6; cursor: default; }
  .gate .error { color: #f87171; font-size: 13px; margin-top: 12px; min-height: 16px; }
</style>

  var ITERATIONS = 250000;

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  var form = document.getElementById('f');
  var pwInput = document.getElementById('pw');
  var btn = document.getElementById('btn');
  var err = document.getElementById('err');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Unlocking…';

    var enc = new TextEncoder();
    var salt = b64ToBytes(SALT);
    var nonce = b64ToBytes(NONCE);
    var ct = b64ToBytes(CT);

    crypto.subtle.importKey('raw', enc.encode(pwInput.value), { name: 'PBKDF2' }, false, ['deriveKey'])
      .then(function (baseKey) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: ITERATIONS, hash: 'SHA-256' },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: nonce }, key, ct);
      })
      .then(function (plainBuf) {
        var html = new TextDecoder().decode(plainBuf);
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        err.textContent = 'Incorrect password.';
        btn.disabled = false;
        btn.textContent = 'Unlock';
        pwInput.select();
      });
  });
