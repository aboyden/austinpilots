<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Austin Pilots Webpages</title>
<style>
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: #0f1a2b;
  }
  .wrap {
    width: 100%;
    min-height: 100vh;
    box-sizing: border-box;
    background: #0f1a2b;
    color: #f4efe6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px;
  }
  .card {
    max-width: 640px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 28px;
  }
  .eyebrow {
    font-family: system-ui, sans-serif;
    letter-spacing: 0.32em;
    font-size: 12px;
    color: #c9974f;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    font-size: 52px;
    line-height: 1.15;
    font-weight: 400;
    color: #f4efe6;
  }
  .rule {
    width: 64px;
    height: 1px;
    background: #c9974f;
  }
  p {
    margin: 0;
    font-family: system-ui, sans-serif;
    font-size: 20px;
    line-height: 1.6;
    color: #cfc6b8;
    font-weight: 300;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#c9974f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    </svg>
    <div class="eyebrow">Austin Pilots</div>
    <h1>Austin Pilots Webpages</h1>
    <div class="rule"></div>
    <p>Coming soon.</p>
  </div>
</div>

</html>
